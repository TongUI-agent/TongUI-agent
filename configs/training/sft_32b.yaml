### model
model_name_or_path: /capacity/userdata/vcsptgmbeyzv/zhangbofei/share/checkpoints/Qwen2.5-VL-32B-Instruct
image_max_pixels: 2116800
trust_remote_code: true
deepspeed: configs/deepspeed/ds_z3_config.json
flash_attn: fa2
enable_liger_kernel: true
use_unsloth_gc: false
use_unsloth: false
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_target: ['attn.proj', 'gate_proj', 'k_proj', 'v_proj', 'up_proj', 'down_proj', 'o_proj']
freeze_vision_tower: false
### dataset
dataset: aitw_with_thoughts,amex-ele,amex-func,guiact_smartphone_thought,guiact_web_multi_thought,guiact_web_single_thought,mind2web_with_thoughts,miniwob_with_thoughts,showui-desktop-augmented,showui-web,baidu_experience_full,wikihow_v3
template: qwen2_vl
cutoff_len: 12288
max_samples: 1000000
overwrite_cache: true
preprocessing_num_workers: 64

### output
output_dir: saves/qwen2_5vl-32b/lora/sft
logging_steps: 1
save_steps: 500
save_total_limit: 8
save_strategy: steps
plot_loss: true
overwrite_output_dir: true
tokenized_path: tmp/data_tokenized/qwen2_5vl-32b-lora-sft

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.0005
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 500